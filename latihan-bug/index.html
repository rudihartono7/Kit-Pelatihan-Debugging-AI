<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Tugas Mini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="kartu">
    <h1>Daftar Tugas Mini</h1>
    <p class="sapaan" id="sapaan"></p>

    <form id="form-tugas">
      <input type="text" id="input-tugas" placeholder="Tulis tugas baru..." autocomplete="off">
      <button type="submit">Tambah</button>
    </form>

    <p id="pesan" class="pesan"></p>
    <ul id="daftar"></ul>
    <p id="ringkasan" class="ringkasan"></p>

    <!-- Tantangan interaktif: tombol ganti tema -->
    <button id="tombol-tema" class="tema">Ganti Tema</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
